# Preparation only; no deployment performed. Render runs the Python backend.
# Build/deploy the static Next.js frontend separately on Vercel.
services:
  - type: web
    name: seattle-data-agent-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m pip install --no-deps --no-build-isolation .
    startCommand: python -m uvicorn seattle_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SEATTLE_OPENAI_API_KEY
        sync: false
      - key: SEATTLE_OPENAI_MODEL
        value: gpt-4.1-mini
