# Preparation only: no deployment performed. This serves the foundation API;
# it does not yet offer live data or an AI agent.
services:
  - type: web
    name: seattle-data-agent-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m pip install --no-deps --no-build-isolation .
    startCommand: python -m uvicorn seattle_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
